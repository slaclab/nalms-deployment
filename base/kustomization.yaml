---
# Everything deployed to the nalms-dev namespace apart from the Strimzi operator bundle, which is
# applied on its own (see the README).
#
# Labels are written out in each manifest rather than being added here with commonLabels. A common
# label also rewrites every selector, and selectors cannot be changed on a Deployment or StatefulSet
# that already exists.
#
# The LCLS alarm server and logger are not deployed at the moment, so they are commented out.
namespace: nalms-dev
resources:
  - ns.yaml
  - kafka-persistent-w-metrics.yaml
  - kafka-broker-nodepool.yaml
  - kafka-controller-nodepool.yaml
#  - phoebus-alrm-srv-lcls.yaml
  - phoebus-alrm-srv-cryo.yaml
#  - loki-alrm-log-lcls.yaml
  - loki-alrm-log-cryo.yaml
  - loki-alrm-send-cryo.yaml
configMapGenerator:
  # xml/cryo.xml is an empty placeholder, not the real configuration (that is alarm-config/cryo.xml,
  # delivered by the git-sync sidecar). It is copied into the pod at start so the file exists before
  # the sidecar's first sync. The alarm server skips it because its config name is lowercase "cryo"
  # and the server expects "CRYO". Do not change that name, and note that any edit to the file
  # changes the generated configmap name, which restarts the alarm server on the next apply.
  - name: nalms-cryo-configmap
    files: [xml/cryo.xml]
  - name: nalms-alarm-server-configmap
    files: [alarm-properties/alarm_server.properties]
generatorOptions:
  labels:
    app: nalms
    app.kubernetes.io/part-of: phoebus
    app.kubernetes.io/component: configmap

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka
  labels:
    strimzi.io/cluster: nalms
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    # deleteClaim is left at its default of false, so the volumes are kept if a node is removed
  resources:
    requests:
      memory: 24Gi
      cpu: "4"
    limits:
      memory: 32Gi
      cpu: "8"

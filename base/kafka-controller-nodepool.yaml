---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: nalms
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: persistent-claim
    size: 5Gi
    # deleteClaim is left at its default of false, so the volumes are kept if a node is removed
  resources:
    requests:
      memory: 3Gi
      cpu: "2"
    limits:
      memory: 6Gi
      cpu: "4"

